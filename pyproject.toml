[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "india-day-trader"
version = "0.2.0"
description = "Broker-agnostic Indian equity research and paper trading toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "india-day-trader contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
india-day-trader = "india_day_trader.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.14.2", "build==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
